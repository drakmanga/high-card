spring.application.name=demo

# ---------------------------------------------------------------------------
# Sicurezza JWT
# ---------------------------------------------------------------------------
# ATTENZIONE: il segreto qui sotto è un valore di sviluppo, presente solo per
# rendere il progetto eseguibile senza configurazione aggiuntiva. In esercizio
# deve essere fornito da variabile d'ambiente o da un gestore di segreti e non
# deve mai essere versionato. La variabile JWT_SECRET ha la precedenza.
security.jwt.issuer=https://auth.sara.it
security.jwt.audience=high-card-api
security.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1kby1ub3QtdXNlLWluLXByb2Q=}
security.jwt.expiration-seconds=3600
security.jwt.clock-skew-seconds=30
